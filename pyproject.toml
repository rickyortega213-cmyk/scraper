[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmscrape"
version = "0.1.0"
description = "Google Maps lead scraper with website email discovery, permutation guessing and verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tldextract>=5.1",
    "dnspython>=2.6",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
gmscrape = "gmscrape.cli:main"

[tool.setuptools.packages.find]
include = ["gmscrape*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
